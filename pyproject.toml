[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-management-backend"
version = "1.0.0"
description = "API REST para la gestión de un taller mecánico: vehículos, mantenimientos y usuarios con JWT y RBAC."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "pipehd54" }]
keywords = ["fastapi", "taller", "mantenimiento", "vehiculos", "jwt", "rbac"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]

# Versiones fijadas para que el despliegue sea reproducible: el conjunto exacto
# que ya se validó en CI contra PostgreSQL 16.
dependencies = [
    "alembic==1.18.4",
    "annotated-types==0.7.0",
    "anyio==4.14.0",
    "asyncpg==0.31.0",
    "bcrypt==4.3.0",
    "certifi==2026.5.20",
    "email-validator==2.3.0",
    "fastapi==0.137.1",
    "greenlet==3.5.2",
    "h11==0.16.0",
    "idna==3.18",
    "Mako==1.3.12",
    "MarkupSafe==3.0.3",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pydantic-settings==2.14.1",
    "PyJWT==2.13.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "SQLAlchemy==2.0.51",
    "starlette==1.3.1",
    "typing-extensions==4.15.0",
    "uvicorn==0.49.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite==0.21.0",
    "httpx==0.28.1",
    "mypy==1.18.2",
    "pip-audit==2.9.0",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "pytest-cov==7.0.0",
    "ruff==0.16.7",
]

[project.urls]
Homepage = "https://github.com/pipehd54/vehicle-management-backend"
Repository = "https://github.com/pipehd54/vehicle-management-backend"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff: linter y formateador. La configuración es explícita a propósito, para
# que el resultado no dependa de los valores por defecto de cada versión.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "PIE",  # miscellaneous
    "RUF",  # reglas propias de ruff
    "ASYNC",# async
    "S",    # bandit (seguridad)
    "D",    # pydocstyle
]
ignore = [
    "D203",  # incompatible con D211
    "D213",  # incompatible con D212
    "D401",  # el estilo del proyecto usa "Describe..." en imperativo
    "B008",  # Depends() en defaults es el idioma de FastAPI
    "RUF012",# las anotaciones Mutable[T] en modelos SQLAlchemy son intencionadas
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "S101", "N806"]
"alembic/**" = ["D100", "D103"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config"
markers = [
    "integracion: pruebas que requieren base de datos (PostgreSQL)",
]

# ---------------------------------------------------------------------------
# Cobertura
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/cli.py"]
# SQLAlchemy ejecuta el acceso a la base de datos dentro de greenlets y
# FastAPI usa task groups: sin esta opción, coverage pierde el rastro de las
# líneas que siguen a un `await` que suspende la corrutina.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# MyPy (informativo: no bloquea CI todavía)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false
exclude = ["alembic/versions/"]
