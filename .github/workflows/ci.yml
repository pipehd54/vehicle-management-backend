name: CI  # Nombre que aparece en GitHub

# ¿Cuándo se ejecuta? En cada push a main/master o en cada pull request
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# Cancela las ejecuciones anteriores del mismo ref: ahorra minutos de runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Credenciales de la base de datos de pruebas (servicio efímero de CI).
  DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
  TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
  SECRET_KEY: test-secret-key-for-ci-only-00000000
  ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: 60
  APP_ENV: pruebas

jobs:
  calidad:
    name: Formato y lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instala dependencias
        run: pip install -e ".[dev]"

      - name: Comprueba el formato
        run: ruff format --check .

      - name: Lint with ruff
        run: ruff check .

  pruebas:
    name: Pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        # Espera a que PostgreSQL esté listo antes de continuar
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instala dependencias
        run: pip install -e ".[dev]"

      - name: Valida las migraciones de PostgreSQL
        run: alembic upgrade head

      # Detecta diferencias entre los modelos y el esquema migrado.
      # Se mantiene sin bloquear el pipeline hasta confirmar que está limpio.
      - name: Comprueba la deriva entre modelos y migraciones
        continue-on-error: true
        run: alembic check

      - name: Ejecuta las pruebas
        if: matrix.python-version != '3.12'
        run: pytest -q

      - name: Ejecuta las pruebas con cobertura
        if: matrix.python-version == '3.12'
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml:cobertura.xml

      - name: Resumen de cobertura
        if: matrix.python-version == '3.12'
        run: |
          {
            echo "## 📊 Cobertura"
            echo '```'
            coverage report -m
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sube el informe de cobertura
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: cobertura
          path: cobertura.xml
          retention-days: 7

  dependencias:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instala dependencias
        run: pip install -e ".[dev]"

      # Informe de seguridad: no bloquea el pipeline mientras se revisan los avisos.
      - name: Audita las dependencias
        continue-on-error: true
        run: pip-audit --progress-spinner off

  imagen:
    name: Imagen de Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Construye la imagen
        run: docker build -t vehicle-management-backend:ci .
